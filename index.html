<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Planta da Casa — 7,45 × 10,20 m</title>
  <link rel="stylesheet" href="styles.css?v=9" />
</head>
<body>
  <header class="topbar">
    <div class="title">
      <h1>Planta da Casa</h1>
      <span class="subtitle">7,45 × 10,20 m</span>
    </div>
    <div class="controls">
      <div class="layer-checks" role="group" aria-label="Folhas">
        <label class="layer-check" data-folha="estrutura" title="Eixos em traço-ponto, pilares 27×14 cm e cotas de eixo a eixo"><input type="checkbox" id="chkEstrutura" checked> Estrutura</label>
        <label class="layer-check" data-folha="vedacao" title="Paredes com 14 cm, envelope A/B/C, coluna falsa e trechos da parede B"><input type="checkbox" id="chkVedacao" checked> Vedação</label>
        <label class="layer-check" data-folha="esquadrias" title="Portas de giro, vidro da entrada, três folhas e janela alta"><input type="checkbox" id="chkEsquadrias" checked> Esquadrias</label>
        <label class="layer-check" data-folha="cotas" title="Cotas de face a face da arquitetura"><input type="checkbox" id="chkCotas" checked> Cotas</label>
        <label class="layer-check" data-folha="ambientes" title="Nomes dos ambientes: cozinha, banheiro, quartos e copa/sala"><input type="checkbox" id="chkAmbientes" checked> Ambientes</label>
      </div>
    </div>
  </header>

  <main class="layout" id="viewport">
    <div class="sheet" id="sheet"></div>
    <canvas id="planta" width="600" height="780" aria-label="Planta baixa da casa"></canvas>
    <footer class="legend">
    <section>
      <h2>Portas</h2>
      <ul id="portaList" class="parede-list"></ul>
    </section>

    <section>
      <h2>Janelas</h2>
      <ul id="janelaList" class="parede-list"></ul>
    </section>

    <section>
      <h2>Legenda</h2>
      <ul id="legendList"></ul>
    </section>

    <section>
      <h2>Condições das paredes</h2>
      <ul class="walls">
        <li><strong>A</strong> — esquerda (10,20 m) · cega</li>
        <li><strong>B</strong> — direita (10,20 m) · entrada 3,20 m + parede cega 7,00 m</li>
        <li><strong>C</strong> — fundo (7,45 m) · subsolo · cega</li>
      </ul>
    </section>

  </footer>
  </main>

  <script src="app.js?v=28"></script>
</body>
</html>
